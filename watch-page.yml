# t195: publishes the browser WATCH PAGE (public/watch/) to GitHub Pages, so
# the everyone-link works: https://<user>.github.io/<repo>/#HB-XXXXXX
# One-time setup by the repo owner: Settings → Pages → Source: "GitHub Actions".
name: Watch page
on:
  push:
    branches: [main]
    paths: ['public/watch/**', '.github/workflows/watch-page.yml']
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public/watch
      - id: deploy
        uses: actions/deploy-pages@v4
