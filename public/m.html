<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Home Binger — Simple Mode</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'><rect width='64' height='64' rx='12' fill='%230a0f2e'/><text x='32' y='42' font-size='34' text-anchor='middle' fill='%23ff3ea5' font-family='sans-serif' font-weight='900' font-style='italic'>HB</text></svg>">
<style>
  :root { --ink:#eef1ff; --muted:#9aa3c7; --bg:#0a0f2e; --panel:rgba(16,22,52,.85); --line:#2a3354; --accent:#ff3ea5; }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body { margin:0; background:radial-gradient(1200px 600px at 50% -10%, #141b44 0%, var(--bg) 60%); color:var(--ink); font:15px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  header { position:sticky; top:0; z-index:5; background:var(--panel); backdrop-filter:blur(10px); border-bottom:1px solid var(--line); padding:10px 14px; display:flex; align-items:center; gap:10px; }
  header .logo { font-weight:900; font-style:italic; letter-spacing:.5px; color:var(--accent); font-size:17px; white-space:nowrap; }
  header input { flex:1; min-width:0; padding:9px 12px; border-radius:10px; border:1px solid var(--line); background:rgba(10,12,30,.6); color:var(--ink); font:inherit; }
  .mode-btn, .btn { border:1px solid var(--line); background:rgba(10,12,30,.6); color:var(--ink); border-radius:10px; padding:8px 12px; font:inherit; font-size:13px; cursor:pointer; }
  .btn.accent { background:var(--accent); border-color:var(--accent); color:#fff; font-weight:700; }
  main { padding:14px; max-width:760px; margin:0 auto; }
  #grid { display:grid; grid-template-columns:repeat(auto-fill, minmax(110px, 1fr)); gap:12px; }
  .cell { cursor:pointer; }
  .cell .art { width:100%; aspect-ratio:2/3; border-radius:10px; object-fit:cover; background:linear-gradient(160deg,#1a2350,#101637); border:1px solid var(--line); display:block; }
  .cell .t { font-size:12.5px; margin-top:6px; line-height:1.25; max-height:2.5em; overflow:hidden; }
  .cell .s { font-size:11px; color:var(--muted); }
  #list .row { display:flex; align-items:center; gap:12px; padding:12px 4px; border-bottom:1px solid var(--line); cursor:pointer; }
  #list .row .ico { font-size:22px; width:1.6em; text-align:center; }
  #list .row .t { flex:1; min-width:0; }
  #list .row .t b { display:block; font-size:14.5px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  #list .row .t small { color:var(--muted); }
  #list .row .go { color:var(--accent); font-size:20px; }
  .hint { color:var(--muted); font-size:13px; padding:20px 4px; text-align:center; }
  /* the player sheet */
  #player { position:fixed; inset:0; background:rgba(4,6,18,.96); z-index:20; display:none; flex-direction:column; }
  #player.on { display:flex; }
  #player .pbar { display:flex; align-items:center; gap:10px; padding:12px 14px; border-bottom:1px solid var(--line); }
  #player .pbar b { flex:1; min-width:0; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; font-size:15px; }
  #player video, #player img.art { flex:1; width:100%; min-height:0; object-fit:contain; background:#000; }
  #player img.art { object-fit:contain; padding:40px; }
  #player .pfoot { padding:12px 14px 22px; display:flex; gap:10px; justify-content:center; border-top:1px solid var(--line); }
  /* login card */
  #gate { max-width:340px; margin:12vh auto 0; background:var(--panel); border:1px solid var(--line); border-radius:16px; padding:22px; }
  #gate h1 { margin:0 0 4px; font-size:20px; }
  #gate p { margin:0 0 16px; color:var(--muted); font-size:13px; }
  #gate .field { margin-bottom:10px; }
  #gate label { display:block; font-size:12px; color:var(--muted); margin-bottom:4px; }
  #gate input { width:100%; padding:11px 12px; border-radius:10px; border:1px solid var(--line); background:rgba(10,12,30,.6); color:var(--ink); font:inherit; }
  #gate .row { display:flex; gap:8px; margin-top:14px; }
  #gate .msg { color:#ff8a8a; font-size:12.5px; min-height:16px; margin-top:8px; }
  footer { text-align:center; padding:26px 14px 40px; color:var(--muted); font-size:12.5px; }
  footer a { color:var(--accent); }
</style>
</head>
<body>
<header>
  <span class="logo">HOME BINGER</span>
  <input id="q" type="search" placeholder="🔍 Search…" autocomplete="off">
  <button class="mode-btn" id="mode" title="Switch between the poster grid and the low-data list">☰</button>
</header>
<main>
  <div id="gate" hidden>
    <h1>Welcome to the store 🎬</h1>
    <p>The simple list view — everything on the shelves, no 3D needed.</p>
    <div class="field"><label>Username</label><input id="u" autocomplete="username"></div>
    <div class="field"><label>Password</label><input id="p" type="password" autocomplete="current-password"></div>
    <div class="row"><button class="btn accent" id="signin" style="flex:1">Sign in</button></div>
    <div class="msg" id="gmsg"></div>
    <p style="margin-top:14px">No account? Browse as a guest —
      <a href="#" id="guest" style="color:var(--accent)">the shelves are stocked either way</a>.</p>
  </div>
  <div id="grid"></div>
  <div id="list" hidden></div>
  <div class="hint" id="empty" hidden>Nothing on the shelves yet.</div>
</main>

<div id="player">
  <div class="pbar">
    <button class="btn" id="back">← Back</button>
    <b id="ptitle"></b>
    <button class="btn" id="pshare">…</button>
  </div>
  <video id="vid" playsinline controls></video>
  <img class="art" id="part" alt="" hidden>
  <div class="pfoot">
    <span class="hint" style="padding:0" id="psub"></span>
  </div>
</div>

<footer>
  <a href="/?desktop=1">🖥 Desktop mode — the full 3D store</a><br>
  <span>Home Binger · Simple Mode</span>
</footer>

<script src="/vendor/hls.min.js"></script>
<script src="/js/m.js?v=1789261059676"></script>
</body>
</html>
